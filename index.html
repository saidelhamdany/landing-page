<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>كيفية كسب 50 دولار للساعة وبدون رأس مال</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      direction: rtl;
      text-align: center;
      padding: 40px;
    }
    .box {
      background: #ffffff;
      padding: 30px;
      max-width: 700px;
      margin: auto;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    h1 {
      color: #222;
    }
    p {
      font-size: 18px;
      color: #444;
      line-height: 1.8;
    }
    #locker {
      margin-top: 30px;
    }
    .loading {
      margin-top: 20px;
      font-size: 16px;
      color: #666;
    }
  </style>
</head>
<body>

  <div class="box">
    <h1>كيفية كسب 50 دولار للساعة وبدون رأس مال</h1>

    <p>
      للوصول إلى المقال ومعرفة الطريقة لتحقيق  
      <strong>50 دولار للساعة وبدون رأس مال</strong>،  
      يرجى إكمال العرض أسفله.
    </p>

    <div class="loading">جاري تحميل العرض…</div>

    <!-- مكان العرض -->
    <div id="locker"></div>
  </div>

  <script>
    // تحميل العرض مباشرة عند فتح الصفحة
    (function () {
      const locker = document.getElementById("locker");

      const script = document.createElement("script");
      script.type = "text/javascript";
      script.src = "https://playabledownloads.com/script_include.php?id=1871657";
      script.async = true;

      locker.appendChild(script);
    })();
  </script>

</body>
</html>
