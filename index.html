<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>اكسب 90 دولار في الساعة</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      direction: rtl;
      text-align: center;
      padding: 40px;
    }
    .box {
      background: #ffffff;
      padding: 30px;
      max-width: 700px;
      margin: auto;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    h1 {
      color: #222;
    }
    p {
      font-size: 18px;
      color: #444;
      line-height: 1.8;
    }
    .btn {
      display: inline-block;
      margin-top: 20px;
      padding: 15px 30px;
      font-size: 18px;
      color: #fff;
      background-color: #e63946;
      border-radius: 8px;
      text-decoration: none;
      cursor: pointer;
    }
    #locker {
      margin-top: 30px;
      display: none;
    }
  </style>
</head>
<body>

  <div class="box">
    <h1>كيفية كسب 50 دولار للساعة وبدون رأس مال</h1>

    <p>
      للوصول إلى المقال ومعرفة الطريقة لتحقيق  
      <strong>50 دولار في الساعة وبدون رأس مال</strong>،  
      يرجى الضغط على الزر أسفله وإكمال عرض واحد فقط.
    </p>

    <!-- زر التفعيل -->
    <a class="btn" id="openLocker">
      اضغط هنا
    </a>

    <!-- مكان تحميل الـ Content Locker -->
    <div id="locker"></div>
  </div>

  <script>
    document.getElementById("openLocker").addEventListener("click", function () {
      const lockerDiv = document.getElementById("locker");
      lockerDiv.style.display = "block";

      // منع تحميل السكريبت أكثر من مرة
      if (document.getElementById("cpa-locker")) return;

      const script = document.createElement("script");
      script.id = "cpa-locker";
      script.type = "text/javascript";
      script.src = "https://playabledownloads.com/script_include.php?id=1871657";

      lockerDiv.appendChild(script);
    });
  </script>

</body>
</html>
